<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offres</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="jobs">
    <div class="app-shell">
        <aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">GC</span>Gestion Carrieres</a>
            <nav class="side-nav"><a href="/candidate-dashboard.html">Dashboard</a><a class="active"
                    href="/jobs.html">Offres</a><a href="/applications.html">Candidatures</a><a
                    href="/matching.html">Matching</a><a href="/messages.html">Messages</a><a
                    href="/notifications.html">Notifications</a></nav>
            <div class="side-footer"><span data-user-name></span> · <span data-user-role></span></div>
        </aside>
        <main class="main">
            <div class="topbar">
                <div>
                    <h1>Offres d'emploi</h1>
                    <p>Recherche, filtres et candidatures.</p>
                </div>
                <div class="nav-actions"><button class="btn" data-theme-toggle>Theme</button><button class="btn" data-logout>Logout</button></div>
            </div>
            <div class="toolbar">
                <input id="jobSearch" class="search" placeholder="Rechercher (titre, ville, entreprise)…">
                <select id="jobStatutFilter" class="btn hidden" title="Filtrer par statut">
                    <option value="">Tous les statuts</option>
                    <option>Ouverte</option>
                    <option>Fermée</option>
                    <option>Suspendue</option>
                </select>
                <button id="jobsPrev" class="btn">← Précédent</button>
                <span id="jobsPaginationInfo" class="nav-link"></span>
                <button id="jobsNext" class="btn">Suivant →</button>
            </div>
            <div id="jobsList" class="list"></div>
        </main>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/jobs.js"></script>
</body>

</html>
