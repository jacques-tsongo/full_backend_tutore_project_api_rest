<?xml version="1.0" encoding="UTF-8"?>
<!-- Fond des pages Connexion / Inscription — LinkEmploi
     Scène vectorielle professionnelle évoquant les carrières :
     horizon urbain d'entreprises, grille de données discrète et
     trajectoire de carrière ascendante (étapes franchies). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Horizon professionnel LinkEmploi">
  <defs>
    <!-- Ciel : dégradé bleu-vert profond, palette de la plateforme -->
    <linearGradient id="ciel" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#0a3a46"/>
      <stop offset="0.55" stop-color="#0d5564"/>
      <stop offset="1" stop-color="#072b36"/>
    </linearGradient>
    <!-- Lueur douce en haut à droite -->
    <radialGradient id="lueur" cx="0.78" cy="0.14" r="0.55">
      <stop offset="0" stop-color="#3fb6c7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3fb6c7" stop-opacity="0"/>
    </radialGradient>
    <!-- Trajectoire de carrière : montée en teal lumineux -->
    <linearGradient id="carriere" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb6c7"/>
      <stop offset="1" stop-color="#89dce8"/>
    </linearGradient>
    <!-- Fenêtres éclairées des immeubles (motif) -->
    <pattern id="fenetres" width="30" height="38" patternUnits="userSpaceOnUse">
      <rect x="7" y="10" width="5" height="9" rx="1" fill="#89dce8" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#ciel)"/>
  <rect width="1920" height="1080" fill="url(#lueur)"/>

  <!-- Grille de données discrète (esprit gestion / recrutement) -->
  <g stroke="#9fd6dd" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
  </g>

  <!-- Horizon urbain arrière-plan (tours hautes, ton moyen) -->
  <g fill="#0b4350" opacity="0.9">
    <rect x="40" y="780" width="120" height="300"/>
    <rect x="200" y="850" width="90" height="230"/>
    <rect x="330" y="700" width="140" height="380"/>
    <rect x="510" y="800" width="110" height="280"/>
    <rect x="660" y="740" width="150" height="340"/>
    <rect x="850" y="830" width="100" height="250"/>
    <rect x="990" y="720" width="130" height="360"/>
    <rect x="1160" y="780" width="110" height="300"/>
    <rect x="1310" y="750" width="150" height="330"/>
    <rect x="1500" y="820" width="120" height="260"/>
    <rect x="1660" y="730" width="140" height="350"/>
    <rect x="1840" y="780" width="110" height="300"/>
  </g>

  <!-- Horizon urbain premier plan (bâtiments larges, ton sombre) avec fenêtres -->
  <g fill="#06242d">
    <rect x="-40" y="870" width="220" height="210"/>
    <rect x="-40" y="870" width="220" height="210" fill="url(#fenetres)"/>
    <rect x="230" y="930" width="180" height="150"/>
    <rect x="230" y="930" width="180" height="150" fill="url(#fenetres)"/>
    <rect x="450" y="820" width="240" height="260"/>
    <rect x="450" y="820" width="240" height="260" fill="url(#fenetres)"/>
    <rect x="740" y="890" width="170" height="190"/>
    <rect x="740" y="890" width="170" height="190" fill="url(#fenetres)"/>
    <rect x="960" y="840" width="210" height="240"/>
    <rect x="960" y="840" width="210" height="240" fill="url(#fenetres)"/>
    <rect x="1210" y="920" width="180" height="160"/>
    <rect x="1210" y="920" width="180" height="160" fill="url(#fenetres)"/>
    <rect x="1430" y="860" width="230" height="220"/>
    <rect x="1430" y="860" width="230" height="220" fill="url(#fenetres)"/>
    <rect x="1700" y="820" width="260" height="260"/>
    <rect x="1700" y="820" width="260" height="260" fill="url(#fenetres)"/>
  </g>

  <!-- Trajectoire de carrière ascendante : du bas à gauche vers le haut à droite -->
  <polyline points="140,950 430,860 760,890 1090,720 1440,560 1780,380"
            fill="none" stroke="url(#carriere)" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  <!-- Étapes franchies (jalons de carrière) -->
  <g>
    <circle cx="140" cy="950" r="8" fill="#f0b45a" opacity="0.95"/>
    <circle cx="140" cy="950" r="3.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="430" cy="860" r="8" fill="#f0b45a" opacity="0.95"/>
    <circle cx="430" cy="860" r="3.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="760" cy="890" r="8" fill="#f0b45a" opacity="0.95"/>
    <circle cx="760" cy="890" r="3.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="1090" cy="720" r="8" fill="#f0b45a" opacity="0.95"/>
    <circle cx="1090" cy="720" r="3.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="1440" cy="560" r="8" fill="#f0b45a" opacity="0.95"/>
    <circle cx="1440" cy="560" r="3.5" fill="#ffffff" opacity="0.85"/>
    <circle cx="1780" cy="380" r="9" fill="#f0b45a" opacity="0.95"/>
    <circle cx="1780" cy="380" r="4" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Opportunités flottantes (points lumineux épars) -->
  <g fill="#89dce8">
    <circle cx="260" cy="300" r="3" opacity="0.35"/>
    <circle cx="520" cy="420" r="2.5" opacity="0.28"/>
    <circle cx="820" cy="250" r="3" opacity="0.4"/>
    <circle cx="1120" cy="380" r="2.5" opacity="0.3"/>
    <circle cx="1500" cy="240" r="3" opacity="0.38"/>
    <circle cx="1760" cy="520" r="2.5" opacity="0.26"/>
    <circle cx="420" cy="640" r="2" opacity="0.22"/>
    <circle cx="1360" cy="180" r="2" opacity="0.3"/>
  </g>
</svg>
