<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="profile">
    <div class="app-shell">
        <aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">GC</span>Gestion Carrieres</a>
            <nav class="side-nav"><a href="/candidate-dashboard.html">Dashboard</a><a class="active"
                    href="/profile.html">Profil</a><a href="/jobs.html">Offres</a><a
                    href="/applications.html">Candidatures</a><a href="/matching.html">Matching</a><a
                    href="/notifications.html">Notifications</a></nav>
            <div class="side-footer"><span data-user-name></span></div>
        </aside>
        <main class="main">
            <div class="topbar">
                <h1>Profil candidat</h1>
                <div class="nav-actions"><button class="btn" data-theme-toggle>Theme</button><button class="btn"
                        data-logout>Logout</button></div>
            </div>
            <section class="grid two">
                <form id="profileForm" class="card form">
                    <div class="field"><label>Bio</label><textarea name="bio"></textarea></div>
                    <div class="field"><label>Adresse</label><input name="adresse"></div>
                    <div class="grid two">
                        <div class="field"><label>Date naissance</label><input name="date_naissance" type="date"></div>
                        <div class="field"><label>Lieu naissance</label><input name="lieu_naissance"></div>
                    </div><button class="btn primary">Enregistrer</button>
                </form>
                <div class="card form">
                    <h2>Fichiers</h2>
                    <div class="field"><label>Photo</label><input id="photoInput" name="photo" type="file"
                            accept="image/png,image/jpeg"></div>
                    <div class="field"><label>CV</label><input id="cvInput" name="cv" type="file"
                            accept=".pdf,.doc,.docx"></div>
                    <div id="uploadProgress" class="progress"><span></span></div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
