<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard recruteur</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="recruiter-dashboard">
    <div class="app-shell">
        <aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">GC</span>Gestion Carrieres</a>
            <nav class="side-nav"><a class="active" href="/recruiter-dashboard.html">Tableau de bord</a><a
                    href="/jobs.html">Offres</a><a href="/applications.html">Candidatures reçues</a><a
                    href="/companies.html">Entreprise</a><a href="/messages.html">Messages</a><a
                    href="/notifications.html">Notifications</a></nav>
            <div class="side-footer"><img src="data-user" alt="" srcset=""><span data-user-name></span> · <span data-user-role></span></div>
        </aside>
        <main class="main">
            <div class="topbar">
                <div>
                    <h1>Dashboard recruteur</h1>
                    <p>Publication d'offres et suivi des candidatures.</p>
                </div>
                <div class="nav-actions"><button class="btn" data-theme-toggle>Theme</button><button class="btn"
                        data-logout>Logout</button></div>
            </div>
            <section id="stats" class="grid three"></section>
            <section class="card" style="margin-top:18px">
                <h2>Nouvelle offre</h2>
                <form id="jobForm" class="form">
                    <div class="grid two">
                        <div class="field"><label>Titre</label><input name="titre_offre" required></div>
                        <div class="field"><label>Localisation</label><input name="localisation" required></div>
                    </div>
                    <div class="field"><label>Description</label><textarea name="description_offre" required></textarea>
                    </div>
                    <div class="grid two">
                        <div class="field"><label>Salaire</label><input name="salaire" type="number"></div>
                        <div class="field"><label>Date expiration</label><input name="date_expiration" type="date"
                                required></div>
                    </div>
                    <button class="btn primary">Publier</button>
                </form>
            </section>
            <section style="margin-top:18px">
                <h2>Mes offres</h2>
                <div id="myOffers" class="list"></div>
            </section>
        </main>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/jobs.js"></script>
</body>

</html>
